<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFICS Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <div class="login-bg-overlay"></div>

    <div class="login-container">
        <div class="login-card">

            <div class="login-header">
                <img src="{{ url_for('static', filename='SFICS-LOGO.PNG') }}" class="login-logo-img">
                <h2>SFICS Admin</h2>
                <p>Attendance Management System</p>
            </div>

            {% if error %}
                <div class="login-error-box">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="login-form">

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

              <div class="input-group">
    <i class="fas fa-lock"></i>
    <input type="password" name="password" id="password" placeholder="Password" required>
    <i class="fas fa-eye" id="togglePassword" style="cursor: pointer; position: absolute; right: 15px; left: auto;"></i>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);

        // toggle the eye slash icon
        this.classList.toggle('fa-eye-slash');
    });
</script>
                <button type="submit" class="login-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 SFICS IT Department</p>
            </div>
        </div>
    </div>

</body>
</html>
